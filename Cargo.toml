[package]
name = "gemma-rust-mcp"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive", "env"] }
rmcp = { version = "3.3.0", features = ["client", "transport-child-process"] }
rustyline = "18.0.1"
serde = "1.0.229"
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "process", "time"] }
